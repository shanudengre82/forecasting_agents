# "Instrument" theme. Colour tokens are mirrored in src/fcagents/theme.py (CSS + Plotly) — keep them in sync.
[theme]
font = "Archivo:https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap"
headingFontWeights = [650, 600, 600, 600, 600, 600]
headingFontSizes = ["1.95rem", "1.55rem", "1.25rem", "1rem", "0.875rem", "0.875rem"]
baseRadius = "4px"
buttonRadius = "4px"
showWidgetBorder = true

[theme.light]
primaryColor = "#1B5FA8"
backgroundColor = "#E9EDF0"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#17222C"
borderColor = "#C5CFD7"
dataframeBorderColor = "#D6DDE3"
linkColor = "#1B5FA8"
blueColor = "#1B5FA8"
violetColor = "#7A4FC4"
greenColor = "#2F7D5B"
yellowColor = "#B7860B"
orangeColor = "#B7860B"
redColor = "#C0392B"
chartCategoricalColors = ["#1B5FA8", "#7A4FC4", "#B7860B", "#2F7D5B", "#8796A3"]

[theme.light.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#E9EDF0"

[theme.dark]
primaryColor = "#5FA2E8"
backgroundColor = "#151B21"
secondaryBackgroundColor = "#1D252D"
textColor = "#E3E9EE"
borderColor = "#33404B"
dataframeBorderColor = "#2A353F"
linkColor = "#7DB5EE"
blueColor = "#5FA2E8"
violetColor = "#A88BEA"
greenColor = "#4FB386"
yellowColor = "#E0B23A"
orangeColor = "#E0B23A"
redColor = "#E8675A"
chartCategoricalColors = ["#5FA2E8", "#A88BEA", "#E0B23A", "#4FB386", "#8796A3"]

[theme.dark.sidebar]
backgroundColor = "#1D252D"
secondaryBackgroundColor = "#151B21"
