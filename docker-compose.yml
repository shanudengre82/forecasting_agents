# docker compose up -d                          → full app (LLM) on http://localhost:7860
# docker compose --profile lite up -d app-lite  → lite app (no LLM) on http://localhost:7861
services:
  app:
    build:
      context: .
      target: full
    image: fcagents:full
    ports:
      - "${PORT:-7860}:7860"
    environment:
      MODEL_ID: ${MODEL_ID:-Qwen/Qwen2.5-0.5B-Instruct}
      USE_LLM: ${USE_LLM:-1}
    volumes:
      - hf-cache:/home/user/.cache/huggingface  # keeps models picked at runtime (e.g. 1.5B)
    restart: unless-stopped

  app-lite:
    profiles: [lite]
    build:
      context: .
      target: lite
    image: fcagents:lite
    ports:
      - "7861:7860"
    restart: unless-stopped

volumes:
  hf-cache:
