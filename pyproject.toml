[project]
name = "fcagents"
version = "0.1.0"
description = "LLM-assisted agents for an end-to-end time series forecasting pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "streamlit>=1.40",
    "plotly>=5.24",
]

[project.optional-dependencies]
llm = [
    "torch>=2.4",
    "transformers>=4.45",
    "accelerate>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fcagents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: loads a real LLM (run with -m slow)"]
addopts = "-m 'not slow'"
